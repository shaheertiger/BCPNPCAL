<!doctype html>
<!-- Hero image: bridging-open-work-permit-bowp. Accent: sky. Layout: headline on top, full-width bridge timeline below. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --ink: #f8fafc; --muted: #cbd5e1;
    --accent: #0284c7; --accent-light: #38bdf8; --accent-soft: rgba(2, 132, 199, 0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", "DejaVu Sans", sans-serif;
    background:
      radial-gradient(circle at 15% 10%, var(--accent-soft), transparent 45%),
      linear-gradient(135deg, var(--bg) 0%, #111c33 100%);
    color: var(--ink); padding: 52px 72px 40px; position: relative;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow {
    display: inline-block; background: var(--accent); color: #fff; font-weight: 800; font-size: 22px;
    letter-spacing: .06em; text-transform: uppercase; padding: 10px 18px; border-radius: 999px;
  }
  h1 { font-size: 56px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; margin-top: 22px; max-width: 760px; }
  h1 em { font-style: normal; color: var(--accent-light); }
  .fee { text-align: right; margin-top: 6px; }
  .fee b { display: block; font-size: 72px; font-weight: 800; line-height: 1; }
  .fee span { display: block; font-size: 24px; color: var(--muted); font-weight: 500; margin-top: 8px; line-height: 1.3; }
  svg { position: absolute; left: 0; bottom: 0; z-index: 1; }
  .brand { position: absolute; z-index: 2; right: 72px; bottom: 36px; display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: var(--muted); }
  .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); display: inline-block; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="eyebrow">Work permits · Guide</div>
      <h1>The <em>Bridging Open Work Permit</em>, explained</h1>
    </div>
    <div class="fee"><b>$255</b><span>$155 permit fee<br>+ $100 open permit fee</span></div>
  </div>

  <svg width="1200" height="330" viewBox="0 0 1200 330" aria-hidden="true">
    <g font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="700">
      <!-- water -->
      <path d="M0 290 Q 60 280 120 290 T 240 290 T 360 290 T 480 290 T 600 290 T 720 290 T 840 290 T 960 290 T 1080 290 T 1200 290 V330 H0Z" fill="#0c4a6e" opacity=".55"/>
      <!-- left bank -->
      <path d="M0 198 H260 L305 330 H0Z" fill="#1e293b"/>
      <!-- right bank -->
      <path d="M1200 198 H940 L895 330 H1200Z" fill="#1e293b"/>
      <!-- pillars -->
      <rect x="302" y="206" width="16" height="84" fill="#334155"/>
      <rect x="882" y="206" width="16" height="84" fill="#334155"/>
      <!-- arch above the deck -->
      <path d="M310 190 Q 600 -60 890 190" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
      <g stroke="#38bdf8" stroke-width="4" opacity=".75">
        <line x1="380" y1="137" x2="380" y2="190"/>
        <line x1="460" y1="94" x2="460" y2="190"/>
        <line x1="740" y1="94" x2="740" y2="190"/>
        <line x1="820" y1="137" x2="820" y2="190"/>
      </g>
      <!-- deck -->
      <rect x="240" y="188" width="720" height="18" rx="4" fill="#0284c7"/>
      <!-- deck label -->
      <rect x="515" y="122" width="170" height="44" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="600" y="152" font-size="24" fill="#f8fafc" text-anchor="middle">BOWP</text>
      <!-- left milestone -->
      <circle cx="120" cy="198" r="16" fill="#f8fafc"/>
      <text x="72" y="250" font-size="24" fill="#f8fafc">Current permit</text>
      <text x="72" y="282" font-size="24" fill="#cbd5e1" font-weight="500">expires</text>
      <!-- right milestone -->
      <circle cx="1080" cy="198" r="16" fill="#38bdf8"/>
      <text x="1128" y="250" font-size="24" fill="#f8fafc" text-anchor="end">PR decision</text>
    </g>
  </svg>
  <div class="brand"><i></i>bcpnpcalculator.ca</div>
</body>
</html>
