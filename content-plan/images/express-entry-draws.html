<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --ink: #f8fafc; --muted: #cbd5e1;
    --accent: #d97706; --accent-soft: rgba(217, 119, 6, 0.20);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", "DejaVu Sans", sans-serif;
    background: radial-gradient(circle at 12% 85%, var(--accent-soft), transparent 45%),
                linear-gradient(135deg, var(--bg) 0%, #111c33 100%);
    color: var(--ink); display: grid; grid-template-columns: 1fr 470px; gap: 40px;
    padding: 60px 68px; position: relative;
  }
  body::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 40px 40px; }
  .copy, .visual { position: relative; z-index: 1; }
  .copy { display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { display: inline-flex; align-self: flex-start; background: var(--accent); color: #fff;
    font-weight: 800; font-size: 22px; letter-spacing: .06em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 999px; }
  h1 { font-size: 58px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; margin-top: 26px; }
  .stat { display: flex; align-items: center; gap: 18px; margin-top: 26px; }
  .stat b { font-size: 60px; font-weight: 800; color: #fbbf24; }
  .stat span { font-size: 24px; color: var(--muted); font-weight: 500; line-height: 1.3; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: var(--muted); }
  .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); display: inline-block; }
  .visual { background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 28px;
    padding: 26px 28px; display: flex; flex-direction: column; }
  .vt { font-size: 24px; font-weight: 800; color: #fff; }
  .vs { font-size: 22px; color: var(--muted); font-weight: 500; margin-top: 4px; }
  .art { width: 100%; flex: 1; margin-top: 10px; }
</style>
</head>
<body>
  <div class="copy">
    <div>
      <div class="eyebrow">Express Entry · 2026 tracker</div>
      <h1>Express Entry draws: latest rounds and CRS cutoffs</h1>
      <div class="stat"><b>149,409</b><span>invitations in 65 rounds,<br>Jan 5 to Oct 28, 2026</span></div>
    </div>
    <div class="brand"><i></i>bcpnpcalculator.ca</div>
  </div>

  <div class="visual">
    <div class="vt">Latest cutoff by round type</div>
    <div class="vs">October 2026 rounds</div>
    <svg class="art" viewBox="0 0 414 400" role="img" aria-label="CRS ladder of latest cutoffs">
      <g font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif">
        <!-- scale: CRS 350 at y=380, 800 at y=20  -> 0.8 px per point -->
        <rect x="40" y="20" width="16" height="360" rx="8" fill="#334155"/>
        <rect x="40" y="20" width="16" height="360" rx="8" fill="url(#g)"/>
        <defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#d97706" stop-opacity=".15"/><stop offset="1" stop-color="#d97706" stop-opacity=".9"/></linearGradient></defs>
        <!-- PNP 761: y = 380 - (761-350)*0.8 = 51 -->
        <g><circle cx="48" cy="51" r="13" fill="#fbbf24" stroke="#0f172a" stroke-width="4"/>
          <line x1="64" y1="51" x2="98" y2="51" stroke="#64748b" stroke-width="2"/>
          <text x="108" y="60" font-size="30" font-weight="800" fill="#fff">761</text>
          <text x="180" y="59" font-size="23" font-weight="600" fill="#cbd5e1">PNP · Oct 26</text></g>
        <!-- CEC 519: y = 380 - 169*0.8 = 245 -->
        <g><circle cx="48" cy="245" r="13" fill="#fbbf24" stroke="#0f172a" stroke-width="4"/>
          <line x1="64" y1="245" x2="98" y2="245" stroke="#64748b" stroke-width="2"/>
          <text x="108" y="254" font-size="30" font-weight="800" fill="#fff">519</text>
          <text x="180" y="253" font-size="23" font-weight="600" fill="#cbd5e1">CEC · Oct 15</text></g>
        <!-- Transport 477: y = 380 - 127*0.8 = 278 ; label offset down a bit -->
        <g><circle cx="48" cy="278" r="13" fill="#f59e0b" stroke="#0f172a" stroke-width="4"/>
          <polyline points="64,278 82,300 98,300" fill="none" stroke="#64748b" stroke-width="2"/>
          <text x="108" y="310" font-size="30" font-weight="800" fill="#fff">477</text>
          <text x="180" y="309" font-size="23" font-weight="600" fill="#cbd5e1">Transport · Oct 28</text></g>
        <!-- French 407: y = 380 - 57*0.8 = 334 -->
        <g><circle cx="48" cy="334" r="13" fill="#d97706" stroke="#0f172a" stroke-width="4"/>
          <polyline points="64,334 82,362 98,362" fill="none" stroke="#64748b" stroke-width="2"/>
          <text x="108" y="372" font-size="30" font-weight="800" fill="#fff">407</text>
          <text x="180" y="371" font-size="23" font-weight="600" fill="#cbd5e1">French · Oct 27</text></g>
      </g>
    </svg>
  </div>
</body>
</html>
