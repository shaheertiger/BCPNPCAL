<!doctype html>
<!--
  Article hero image template: 1200x630, rendered to PNG by
    node scripts/render-article-image.cjs content-plan/images/<slug>.html

  Copy this file to content-plan/images/<slug>.html and design it for the post:
  - Change the eyebrow, headline and key figure to match the article. Every number must
    appear in the article and be verified.
  - Replace the illustration (<svg class="art">) with one drawn for this post: a bar
    chart of real cutoffs, a timeline, a fee breakdown, a map pin, a document stack, a
    route diagram. Keep it simple, flat and readable at thumbnail size.
  - Pick an accent: --accent can be red (#dc2626), indigo (#4f46e5), emerald (#059669),
    amber (#d97706) or sky (#0284c7). Rotate accents and layouts so posts don't look identical.
  - Headline: 4-10 words, at most 3 lines. No tiny text: the minimum font size is 22px.
  - Text must contrast clearly with the background (light text on --bg).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;        /* slate-900 */
    --panel: #1e293b;     /* slate-800 */
    --ink: #f8fafc;       /* slate-50 */
    --muted: #cbd5e1;     /* slate-300 */
    --accent: #d97706;    /* amber-600 */
    --accent-soft: rgba(217, 119, 6, 0.20);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", "DejaVu Sans", sans-serif;
    background:
      radial-gradient(circle at 85% 20%, var(--accent-soft), transparent 45%),
      linear-gradient(135deg, var(--bg) 0%, #111c33 100%);
    color: var(--ink);
    display: grid;
    grid-template-columns: 1fr 540px;
    gap: 40px;
    padding: 56px 60px;
    position: relative;
  }
  body::before { /* subtle grid texture */
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .copy, .visual { position: relative; z-index: 1; }
  .copy { display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow {
    display: inline-flex; align-self: flex-start; gap: 10px; align-items: center;
    background: var(--accent); color: #fff; font-weight: 800; font-size: 22px;
    letter-spacing: .06em; text-transform: uppercase; padding: 10px 18px; border-radius: 999px;
  }
  h1 { font-size: 54px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; margin-top: 28px; }
  .stat { display: flex; align-items: baseline; gap: 16px; margin-top: 24px; }
  .stat b { font-size: 64px; font-weight: 800; color: #fff; }
  .stat span { font-size: 24px; color: var(--muted); font-weight: 500; max-width: 340px; line-height: 1.3; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: var(--muted); }
  .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); display: inline-block; }
  .visual {
    background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 28px;
    display: flex; align-items: center; justify-content: center; padding: 28px;
  }
  .art { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div>
      <div class="eyebrow">Manitoba PNP · EOI draws</div>
      <h1>Manitoba PNP draws: 2026 scores and LAAs</h1>
      <div class="stat"><b>526</b><span>LAAs in Draw #283 on November 5, 2026</span></div>
    </div>
    <div class="brand"><i></i>bcpnpcalculator.ca</div>
  </div>
  <div class="visual">
    <svg class="art" viewBox="0 0 480 500" role="img" aria-label="Lowest scores invited"><g font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="700"><text x="0" y="28" font-size="24" fill="#f8fafc">Lowest score invited, 2026</text><text x="0" y="92" font-size="22" fill="#cbd5e1">Oct 22</text><rect x="88" y="68" width="216" height="34" rx="8" fill="var(--accent)"/><text x="314" y="93" font-size="24" fill="#f8fafc">846</text><text x="374" y="93" font-size="22" fill="#cbd5e1" font-weight="500">Overall</text><text x="0" y="152" font-size="22" fill="#cbd5e1">Oct 22</text><rect x="88" y="128" width="198" height="34" rx="8" fill="#64748b"/><text x="296" y="153" font-size="24" fill="#f8fafc">816</text><text x="356" y="153" font-size="22" fill="#cbd5e1" font-weight="500">MB grads</text><text x="0" y="212" font-size="22" fill="#cbd5e1">Sep 24</text><rect x="88" y="188" width="162" height="34" rx="8" fill="#64748b"/><text x="260" y="213" font-size="24" fill="#f8fafc">760</text><text x="320" y="213" font-size="22" fill="#cbd5e1" font-weight="500">Sciences</text><text x="0" y="272" font-size="22" fill="#cbd5e1">Sep 10</text><rect x="88" y="248" width="203" height="34" rx="8" fill="#64748b"/><text x="301" y="273" font-size="24" fill="#f8fafc">825</text><text x="361" y="273" font-size="22" fill="#cbd5e1" font-weight="500">MB grads</text><text x="0" y="332" font-size="22" fill="#cbd5e1">Aug 27</text><rect x="88" y="308" width="144" height="34" rx="8" fill="#64748b"/><text x="242" y="333" font-size="24" fill="#f8fafc">731</text><text x="302" y="333" font-size="22" fill="#cbd5e1" font-weight="500">Trades</text><text x="0" y="392" font-size="22" fill="#cbd5e1">Jul 30</text><rect x="88" y="368" width="82" height="34" rx="8" fill="#64748b"/><text x="180" y="393" font-size="24" fill="#f8fafc">632</text><text x="240" y="393" font-size="22" fill="#cbd5e1" font-weight="500">Manuf.</text><text x="0" y="452" font-size="22" fill="#cbd5e1">Jul 16</text><rect x="88" y="428" width="203" height="34" rx="8" fill="#64748b"/><text x="301" y="453" font-size="24" fill="#f8fafc">825</text><text x="361" y="453" font-size="22" fill="#cbd5e1" font-weight="500">MB grads</text></g></svg>
  </div>
</body>
</html>
