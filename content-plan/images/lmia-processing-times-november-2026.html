<!doctype html>
<!--
  Article hero image template: 1200x630, rendered to PNG by
    node scripts/render-article-image.cjs content-plan/images/<slug>.html

  Copy this file to content-plan/images/<slug>.html and design it for the post:
  - Change the eyebrow, headline and key figure to match the article. Every number must
    appear in the article and be verified.
  - Replace the illustration (<svg class="art">) with one drawn for this post: a bar
    chart of real cutoffs, a timeline, a fee breakdown, a map pin, a document stack, a
    route diagram. Keep it simple, flat and readable at thumbnail size.
  - Pick an accent: --accent can be red (#dc2626), indigo (#4f46e5), emerald (#059669),
    amber (#d97706) or sky (#0284c7). Rotate accents and layouts so posts don't look identical.
  - Headline: 4-10 words, at most 3 lines. No tiny text: the minimum font size is 22px.
  - Text must contrast clearly with the background (light text on --bg).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;        /* slate-900 */
    --panel: #1e293b;     /* slate-800 */
    --ink: #f8fafc;       /* slate-50 */
    --muted: #cbd5e1;     /* slate-300 */
    --accent: #dc2626;    /* red-600 (brand) */
    --accent-soft: rgba(220, 38, 38, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", "DejaVu Sans", sans-serif;
    background:
      radial-gradient(circle at 85% 20%, var(--accent-soft), transparent 45%),
      linear-gradient(135deg, var(--bg) 0%, #111c33 100%);
    color: var(--ink);
    display: grid;
    grid-template-columns: 1fr 440px;
    gap: 40px;
    padding: 64px 72px;
    position: relative;
  }
  body::before { /* subtle grid texture */
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .copy, .visual { position: relative; z-index: 1; }
  .copy { display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow {
    display: inline-flex; align-self: flex-start; gap: 10px; align-items: center;
    background: var(--accent); color: #fff; font-weight: 800; font-size: 22px;
    letter-spacing: .06em; text-transform: uppercase; padding: 10px 18px; border-radius: 999px;
  }
  h1 { font-size: 60px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; margin-top: 28px; }
  .stat { display: flex; align-items: baseline; gap: 16px; margin-top: 24px; }
  .stat b { font-size: 64px; font-weight: 800; color: #fff; }
  .stat span { font-size: 24px; color: var(--muted); font-weight: 500; max-width: 340px; line-height: 1.3; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: var(--muted); }
  .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); display: inline-block; }
  .visual {
    background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 28px;
    display: flex; align-items: center; justify-content: center; padding: 28px;
  }
  .art { width: 100%; height: 100%; }
  body { grid-template-columns: 1fr 480px; }
  h1 { font-size: 56px; }
  .card { display:grid; grid-template-columns:52px 100px 1fr; align-items:center; gap:18px; background:#0f172a; border:1px solid rgba(255,255,255,.10); border-radius:20px; padding:14px 20px; }
  .card.hot { border:2px solid var(--accent); background:rgba(220,38,38,.12); }
  .card .num { font-size:46px; font-weight:800; min-width:96px; text-align:right; color:#fff; }
  .card.hot .num { color:#fca5a5; }
  .card .lbl { font-size:24px; font-weight:700; color:#e2e8f0; line-height:1.15; }
  .card .lbl small { display:block; font-size:22px; font-weight:500; color:var(--muted); }
  .stack { display:flex; flex-direction:column; gap:14px; width:100%; }
  .visual { padding:24px; flex-direction:column; gap:14px; }
  .cap { font-size:22px; color:var(--muted); font-weight:600; align-self:flex-start; }
</style>
</head>
<body>
  <div class="copy">
    <div>
      <div class="eyebrow">ESDC update &middot; Nov 12, 2026</div>
      <h1>LMIA processing times: the long wait in B.C.</h1>
      <div class="stat"><b>102</b><span>business days, average high-wage LMIA (Oct 2026)</span></div>
    </div>
    <div class="brand"><i></i>bcpnpcalculator.ca</div>
  </div>
  <div class="visual">
    <div class="cap">Average business days, October 2026</div>
    <div class="stack">
      <div class="card hot">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="18" fill="none" stroke="#334155" stroke-width="7"/><circle cx="26" cy="26" r="18" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round" stroke-dasharray="113.1 113.1" transform="rotate(-90 26 26)"/></svg>
      <div class="num">102</div><div class="lbl">High-wage<small>$38.40+ an hour</small></div></div>
      <div class="card">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="18" fill="none" stroke="#334155" stroke-width="7"/><circle cx="26" cy="26" r="18" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-dasharray="104.2 113.1" transform="rotate(-90 26 26)"/></svg>
      <div class="num">94</div><div class="lbl">PR stream<small>Supports PR</small></div></div>
      <div class="card">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="18" fill="none" stroke="#334155" stroke-width="7"/><circle cx="26" cy="26" r="18" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-dasharray="95.4 113.1" transform="rotate(-90 26 26)"/></svg>
      <div class="num">86</div><div class="lbl">Low-wage<small>Under $38.40/hr</small></div></div>
      <div class="card">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="18" fill="none" stroke="#334155" stroke-width="7"/><circle cx="26" cy="26" r="18" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-dasharray="10.0 113.1" transform="rotate(-90 26 26)"/></svg>
      <div class="num">9</div><div class="lbl">Global Talent<small>10-day standard</small></div></div>
    </div>
  </div>
</body>
</html>
