<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --ink: #f8fafc; --muted: #cbd5e1;
    --accent: #4f46e5; --accent-soft: rgba(79, 70, 229, 0.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", "DejaVu Sans", sans-serif;
    background: radial-gradient(circle at 15% 85%, var(--accent-soft), transparent 45%),
                linear-gradient(135deg, var(--bg) 0%, #111c33 100%);
    color: var(--ink); display: grid; grid-template-columns: 1fr 560px; gap: 36px;
    padding: 56px 60px; position: relative;
  }
  body::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 40px 40px; }
  .copy, .visual { position: relative; z-index: 1; }
  .copy { display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { display: inline-flex; align-self: flex-start; background: var(--accent); color: #fff;
    font-weight: 800; font-size: 22px; letter-spacing: .06em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 999px; }
  h1 { font-size: 54px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; margin-top: 26px; }
  .stat { display: flex; align-items: center; gap: 16px; margin-top: 26px; }
  .stat b { font-size: 64px; font-weight: 800; color: #a5b4fc; }
  .stat span { font-size: 24px; color: var(--muted); font-weight: 500; line-height: 1.3; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: var(--muted); }
  .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); display: inline-block; }
  .visual { background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 28px;
    padding: 26px 28px; display: flex; flex-direction: column; }
  .vt { font-size: 24px; font-weight: 800; color: #fff; }
  .vs { font-size: 22px; font-weight: 500; color: var(--muted); margin-top: 4px; }
  .art { width: 504px; height: 432px; margin-top: 10px; }
</style>
</head>
<body>
  <div class="copy">
    <div>
      <div class="eyebrow">Alberta AAIP &middot; Draws</div>
      <h1>Alberta PNP draws: where 2026 scores landed</h1>
      <div class="stat"><b>95</b><span>EOI draws in 2026,<br>Jan 26 to Nov 2</span></div>
    </div>
    <div class="brand"><i></i>bcpnpcalculator.ca</div>
  </div>
  <div class="visual">
    <div class="vt">Latest minimum EOI score</div>
    <div class="vs">Most recent 2026 draw per stream</div>
    <svg class="art" viewBox="0 0 504 432" role="img" aria-label="Bar chart of latest minimum scores">
      <g font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-size="23" font-weight="700">
        <text x="0" y="56" fill="#e2e8f0">Tourism & Hosp.</text>
        <rect x="220" y="34" width="212" height="32" rx="8" fill="var(--accent)"/>
        <text x="442" y="59" fill="#fff" font-weight="800">73</text>
        <text x="0" y="114" fill="#e2e8f0">Health care EE</text>
        <rect x="220" y="92" width="174" height="32" rx="8" fill="#818cf8"/>
        <text x="404" y="117" fill="#fff" font-weight="800">60</text>
        <text x="0" y="172" fill="#e2e8f0">AEE Priority</text>
        <rect x="220" y="150" width="174" height="32" rx="8" fill="#818cf8"/>
        <text x="404" y="175" fill="#fff" font-weight="800">60</text>
        <text x="0" y="230" fill="#e2e8f0">Opportunity</text>
        <rect x="220" y="208" width="171" height="32" rx="8" fill="#818cf8"/>
        <text x="401" y="233" fill="#fff" font-weight="800">59</text>
        <text x="0" y="288" fill="#e2e8f0">Rural Renewal</text>
        <rect x="220" y="266" width="148" height="32" rx="8" fill="#64748b"/>
        <text x="378" y="291" fill="#fff" font-weight="800">51</text>
        <text x="0" y="346" fill="#e2e8f0">Health non-EE</text>
        <rect x="220" y="324" width="145" height="32" rx="8" fill="#64748b"/>
        <text x="375" y="349" fill="#fff" font-weight="800">50</text>
        <text x="0" y="404" fill="#e2e8f0">Law Enforcement</text>
        <rect x="220" y="382" width="142" height="32" rx="8" fill="#64748b"/>
        <text x="372" y="407" fill="#fff" font-weight="800">49</text>
      </g>
    </svg>
  </div>
</body>
</html>
