<!doctype html>
<!--
  Article hero image template: 1200x630, rendered to PNG by
    node scripts/render-article-image.cjs content-plan/images/<slug>.html

  Copy this file to content-plan/images/<slug>.html and design it for the post:
  - Change the eyebrow, headline and key figure to match the article. Every number must
    appear in the article and be verified.
  - Replace the illustration (<svg class="art">) with one drawn for this post: a bar
    chart of real cutoffs, a timeline, a fee breakdown, a map pin, a document stack, a
    route diagram. Keep it simple, flat and readable at thumbnail size.
  - Pick an accent: --accent can be red (#dc2626), indigo (#4f46e5), emerald (#059669),
    amber (#d97706) or sky (#0284c7). Rotate accents and layouts so posts don't look identical.
  - Headline: 4-10 words, at most 3 lines. No tiny text: the minimum font size is 22px.
  - Text must contrast clearly with the background (light text on --bg).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;        /* slate-900 */
    --panel: #1e293b;     /* slate-800 */
    --ink: #f8fafc;       /* slate-50 */
    --muted: #cbd5e1;     /* slate-300 */
    --accent: #059669;    /* emerald-600 */
    --accent-soft: rgba(5, 150, 105, 0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", "DejaVu Sans", sans-serif;
    background:
      radial-gradient(circle at 85% 20%, var(--accent-soft), transparent 45%),
      linear-gradient(135deg, var(--bg) 0%, #111c33 100%);
    color: var(--ink);
    display: grid;
    grid-template-columns: 1fr 470px;
    gap: 40px;
    padding: 64px 72px;
    position: relative;
  }
  body::before { /* subtle grid texture */
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .copy, .visual { position: relative; z-index: 1; }
  .copy { display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow {
    display: inline-flex; align-self: flex-start; gap: 10px; align-items: center;
    background: var(--accent); color: #fff; font-weight: 800; font-size: 22px;
    letter-spacing: .06em; text-transform: uppercase; padding: 10px 18px; border-radius: 999px;
  }
  h1 { font-size: 58px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; margin-top: 28px; }
  .stat { display: flex; align-items: baseline; gap: 16px; margin-top: 24px; }
  .stat b { font-size: 64px; font-weight: 800; color: #fff; }
  .stat span { font-size: 24px; color: var(--muted); font-weight: 500; max-width: 340px; line-height: 1.3; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: var(--muted); }
  .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); display: inline-block; }
  .visual {
    background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 28px;
    display: flex; align-items: center; justify-content: center; padding: 28px;
  }
  .art { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div>
      <div class="eyebrow">Nova Scotia PNP · 2026</div>
      <h1>Four NSNP streams, one EOI pool</h1>
      <div class="stat"><b>5,400</b><span>candidates selected, January to September 2026</span></div>
    </div>
    <div class="brand"><i></i>bcpnpcalculator.ca</div>
  </div>

  <div class="visual">
    <svg class="art" viewBox="0 0 410 470" role="img" aria-label="Four streams flowing into an EOI pool and then to nomination">
      <g font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="700">
        <!-- stream cards -->
        <g font-size="23" fill="#f8fafc">
          <rect x="0" y="0" width="250" height="56" rx="14" fill="#334155"/>
          <circle cx="30" cy="28" r="11" fill="#34d399"/>
          <text x="54" y="36">Skilled Worker</text>
          <rect x="0" y="72" width="250" height="56" rx="14" fill="#334155"/>
          <circle cx="30" cy="100" r="11" fill="#34d399"/>
          <text x="54" y="108">NS Graduate</text>
          <rect x="0" y="144" width="250" height="56" rx="14" fill="#334155"/>
          <circle cx="30" cy="172" r="11" fill="#34d399"/>
          <text x="54" y="180">Express Entry</text>
          <rect x="0" y="216" width="250" height="56" rx="14" fill="#334155"/>
          <circle cx="30" cy="244" r="11" fill="#34d399"/>
          <text x="54" y="252">Entrepreneur</text>
        </g>
        <!-- connectors -->
        <g stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round">
          <path d="M250 28 C 300 28, 300 136, 330 136"/>
          <path d="M250 100 C 295 100, 300 136, 330 136"/>
          <path d="M250 172 C 295 172, 300 136, 330 136"/>
          <path d="M250 244 C 300 244, 300 136, 330 136"/>
        </g>
        <!-- pool -->
        <circle cx="365" cy="136" r="42" fill="#059669"/>
        <text x="365" y="145" text-anchor="middle" font-size="26" fill="#ffffff">EOI</text>
        <!-- arrow down -->
        <path d="M365 182 L365 318" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
        <path d="M351 304 L365 322 L379 304" stroke="#34d399" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- fee tag -->
        <rect x="60" y="306" width="230" height="62" rx="14" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
        <text x="175" y="347" text-anchor="middle" font-size="26" fill="#f8fafc">$1,000 fee</text>
        <!-- nomination -->
        <rect x="60" y="392" width="350" height="70" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
        <path d="M88 427 l12 12 l22 -24" stroke="#34d399" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="140" y="436" font-size="27" fill="#ffffff">Nomination</text>
      </g>
    </svg>
  </div>
</body>
</html>
