<!doctype html>
<!--
  Article hero image template: 1200x630, rendered to PNG by
    node scripts/render-article-image.cjs content-plan/images/<slug>.html

  Copy this file to content-plan/images/<slug>.html and design it for the post:
  - Change the eyebrow, headline and key figure to match the article. Every number must
    appear in the article and be verified.
  - Replace the illustration (<svg class="art">) with one drawn for this post: a bar
    chart of real cutoffs, a timeline, a fee breakdown, a map pin, a document stack, a
    route diagram. Keep it simple, flat and readable at thumbnail size.
  - Pick an accent: --accent can be red (#dc2626), indigo (#4f46e5), emerald (#059669),
    amber (#d97706) or sky (#0284c7). Rotate accents and layouts so posts don't look identical.
  - Headline: 4-10 words, at most 3 lines. No tiny text: the minimum font size is 22px.
  - Text must contrast clearly with the background (light text on --bg).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;        /* slate-900 */
    --panel: #1e293b;     /* slate-800 */
    --ink: #f8fafc;       /* slate-50 */
    --muted: #cbd5e1;     /* slate-300 */
    --accent: #059669;    /* emerald-600 */
    --accent-soft: rgba(5, 150, 105, 0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", "DejaVu Sans", sans-serif;
    background:
      radial-gradient(circle at 85% 20%, var(--accent-soft), transparent 45%),
      linear-gradient(135deg, var(--bg) 0%, #111c33 100%);
    color: var(--ink);
    display: grid;
    grid-template-columns: 1fr 440px;
    gap: 40px;
    padding: 64px 72px;
    position: relative;
  }
  body::before { /* subtle grid texture */
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .copy, .visual { position: relative; z-index: 1; }
  .copy { display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow {
    display: inline-flex; align-self: flex-start; gap: 10px; align-items: center;
    background: var(--accent); color: #fff; font-weight: 800; font-size: 22px;
    letter-spacing: .06em; text-transform: uppercase; padding: 10px 18px; border-radius: 999px;
  }
  h1 { font-size: 58px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; margin-top: 28px; }
  .stat { display: flex; align-items: baseline; gap: 16px; margin-top: 24px; }
  .stat b { font-size: 64px; font-weight: 800; color: #fff; }
  .stat span { font-size: 24px; color: var(--muted); font-weight: 500; max-width: 340px; line-height: 1.3; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: var(--muted); }
  .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); display: inline-block; }
  .visual {
    background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 28px;
    display: flex; align-items: center; justify-content: center; padding: 28px;
  }
  .art { width: 100%; height: 100%; }
  .stat b { white-space: nowrap; }
  .stat span { max-width: 300px; }
</style>
</head>
<body>
  <div class="copy">
    <div>
      <div class="eyebrow">PR approved &middot; Next steps</div>
      <h1>Your COPR: from approval to PR card</h1>
      <div class="stat"><b>30 days</b><span>first PR card processing time (IRCC, Nov 12, 2026)</span></div>
    </div>
    <div class="brand"><i></i>bcpnpcalculator.ca</div>
  </div>

  <div class="visual">
    <svg class="art" viewBox="0 0 380 460" role="img" aria-label="COPR document, passport and three steps">
      <g font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="800">
        <!-- passport -->
        <g transform="rotate(-8 110 120)">
          <rect x="40" y="30" width="140" height="190" rx="14" fill="#065f46" stroke="#10b981" stroke-width="3"/>
          <circle cx="110" cy="105" r="34" fill="none" stroke="#a7f3d0" stroke-width="4"/>
          <path d="M76 105 h68 M110 71 v68" stroke="#a7f3d0" stroke-width="3"/>
          <rect x="70" y="165" width="80" height="12" rx="6" fill="#a7f3d0"/>
        </g>
        <!-- COPR document -->
        <g>
          <rect x="140" y="20" width="200" height="250" rx="14" fill="#f8fafc"/>
          <rect x="140" y="20" width="200" height="56" rx="14" fill="var(--accent)"/>
          <rect x="140" y="56" width="200" height="20" fill="var(--accent)"/>
          <text x="240" y="58" text-anchor="middle" font-size="28" fill="#fff">COPR</text>
          <rect x="162" y="96" width="52" height="64" rx="6" fill="#cbd5e1"/>
          <rect x="226" y="100" width="96" height="10" rx="5" fill="#94a3b8"/>
          <rect x="226" y="122" width="80" height="10" rx="5" fill="#94a3b8"/>
          <rect x="226" y="144" width="90" height="10" rx="5" fill="#94a3b8"/>
          <rect x="162" y="180" width="160" height="10" rx="5" fill="#cbd5e1"/>
          <rect x="162" y="200" width="130" height="10" rx="5" fill="#cbd5e1"/>
          <circle cx="292" cy="234" r="22" fill="none" stroke="var(--accent)" stroke-width="5"/>
          <path d="M281 234 l8 8 l15 -16" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- step flow -->
        <line x1="60" y1="340" x2="320" y2="340" stroke="#475569" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
        <circle cx="60" cy="340" r="24" fill="var(--accent)"/>
        <circle cx="190" cy="340" r="24" fill="var(--accent)"/>
        <circle cx="320" cy="340" r="24" fill="#f8fafc"/>
        <path d="M49 340 l8 8 l14 -15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M179 340 l8 8 l14 -15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="306" y="331" width="28" height="18" rx="4" fill="none" stroke="var(--accent)" stroke-width="3"/>
        <text x="60" y="400" text-anchor="middle" font-size="24" fill="#e2e8f0">Approve</text>
        <text x="190" y="400" text-anchor="middle" font-size="24" fill="#e2e8f0">Land</text>
        <text x="320" y="400" text-anchor="middle" font-size="24" fill="#e2e8f0">PR card</text>
      </g>
    </svg>
  </div>
</body>
</html>
