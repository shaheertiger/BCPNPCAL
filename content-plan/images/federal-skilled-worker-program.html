<!doctype html>
<!-- Hero image: federal-skilled-worker-program. Numbers: six FSW factor maximums (28, 25, 15, 12, 10, 10), total 100, pass mark 67 (IRCC six selection factors page, modified 2026-11-03). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --ink: #f8fafc; --muted: #cbd5e1;
    --accent: #059669; --accent-hi: #34d399; --accent-soft: rgba(5,150,105,0.20);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Plus Jakarta Sans", "DejaVu Sans", sans-serif;
    background: radial-gradient(circle at 80% 15%, var(--accent-soft), transparent 45%),
                linear-gradient(135deg, var(--bg) 0%, #111c33 100%);
    color: var(--ink); display: grid; grid-template-columns: 1fr 500px; gap: 44px;
    padding: 60px 64px; position: relative;
  }
  body::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 40px 40px; }
  .copy, .card { position: relative; z-index: 1; }
  .copy { display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { display: inline-flex; align-self: flex-start; background: var(--accent); color: #fff;
    font-weight: 800; font-size: 22px; letter-spacing: .06em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 999px; }
  h1 { font-size: 58px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; margin-top: 26px; }
  .stat { display: flex; align-items: center; gap: 18px; margin-top: 28px; }
  .stat svg { flex: none; }
  .stat span { font-size: 25px; color: var(--muted); font-weight: 500; line-height: 1.3; max-width: 360px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: var(--muted); }
  .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); display: inline-block; }
  .card { background: var(--panel); border: 1px solid rgba(255,255,255,.10); border-radius: 26px;
    padding: 26px 30px 24px; display: flex; flex-direction: column; }
  .card .clip { position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 28px; border-radius: 10px; background: #475569; border: 2px solid #64748b; }
  .head { display: flex; justify-content: space-between; font-size: 22px; font-weight: 800;
    color: var(--accent-hi); text-transform: uppercase; letter-spacing: .06em; padding-bottom: 10px;
    border-bottom: 2px solid rgba(255,255,255,.12); }
  .row { display: flex; align-items: center; gap: 14px; padding: 13px 0; font-size: 24px; font-weight: 700;
    border-bottom: 1px dashed rgba(255,255,255,.12); }
  .row .tick { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--accent-hi);
    display: flex; align-items: center; justify-content: center; flex: none; }
  .row .name { flex: 1; }
  .row .pts { min-width: 62px; text-align: center; background: rgba(52,211,153,.14); color: #a7f3d0;
    border-radius: 10px; padding: 2px 10px; font-weight: 800; }
  .total { display: flex; justify-content: space-between; align-items: center; margin-top: auto;
    font-size: 24px; font-weight: 800; }
  .total .pass { background: var(--accent); color: #fff; border-radius: 12px; padding: 6px 14px; }
</style>
</head>
<body>
  <div class="copy">
    <div>
      <div class="eyebrow">Express Entry &middot; FSW</div>
      <h1>Federal Skilled Worker Program: the 67-point test</h1>
      <div class="stat">
        <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
          <circle cx="66" cy="66" r="54" fill="none" stroke="#334155" stroke-width="14"/>
          <circle cx="66" cy="66" r="54" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round"
                  stroke-dasharray="227.3 339.3" transform="rotate(-90 66 66)"/>
          <text x="66" y="78" text-anchor="middle" font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-size="38" font-weight="800" fill="#fff">67</text>
        </svg>
        <span>points out of 100 needed to qualify for the FSW pool</span>
      </div>
    </div>
    <div class="brand"><i></i>bcpnpcalculator.ca</div>
  </div>

  <div class="card">
    <div class="clip"></div>
    <div class="head"><span>Selection factor</span><span>Max</span></div>
    <div class="row"><div class="tick"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9.5l4 4 8-9" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="name">Language</div><div class="pts">28</div></div>
    <div class="row"><div class="tick"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9.5l4 4 8-9" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="name">Education</div><div class="pts">25</div></div>
    <div class="row"><div class="tick"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9.5l4 4 8-9" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="name">Work experience</div><div class="pts">15</div></div>
    <div class="row"><div class="tick"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9.5l4 4 8-9" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="name">Age</div><div class="pts">12</div></div>
    <div class="row"><div class="tick"></div><div class="name">Arranged employment</div><div class="pts">10</div></div>
    <div class="row"><div class="tick"></div><div class="name">Adaptability</div><div class="pts">10</div></div>
    <div class="total"><span>Total 100</span><span class="pass">Pass mark 67</span></div>
  </div>
</body>
</html>
